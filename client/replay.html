<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Caddy serves this HTML for /admin/replay/<id>/view, so relative
         `./assets/...` script paths emitted by Vite would resolve against
         /admin/replay/<id>/view/ and 404. <base> pins resolution to the
         document root so every asset URL becomes /assets/... regardless
         of viewer URL. -->
    <base href="/">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <title>VIBECAT 404 — Replay</title>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <script type="module" src="/src/replay-main.ts"></script>
</body>
</html>
