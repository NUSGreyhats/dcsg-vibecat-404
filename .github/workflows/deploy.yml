name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    # Per-run overrides. Leave a field blank to keep the repo Variable
    # default (set under Settings → Secrets and variables → Actions →
    # Variables). Anything you type here wins over the Variable for
    # this single run only — the Variable itself is not modified.
    # Secrets (TELEGRAM_BOT_TOKEN, ADMIN_SESSION_SECRET, etc.) are NOT
    # exposed here on purpose; they stay in repo Secrets so they aren't
    # echoed into the workflow log or surfaced in the trigger UI.
    inputs:
      AUTH_MODE:
        description: "AUTH_MODE (open|identity|token) — blank uses repo Variable"
        required: false
        default: ""
      QUEUE_ENABLED:
        description: "QUEUE_ENABLED (true|false) — blank uses repo Variable"
        required: false
        default: ""
      MAX_CONCURRENT:
        description: "MAX_CONCURRENT (int) — blank uses repo Variable"
        required: false
        default: ""
      LEADERBOARD_ENABLED:
        description: "LEADERBOARD_ENABLED (true|false) — blank uses repo Variable"
        required: false
        default: ""
      LEADERBOARD_DISABLED_MESSAGE:
        description: "Win-screen booth CTA when leaderboard is off — blank uses repo Variable"
        required: false
        default: ""

# Serialize deploys so two pushes in a row don't fight for the droplet.
concurrency:
  group: deploy-digitalocean
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docker-compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Per-run input wins when non-empty; otherwise fall back to
          # the repo Variable. GitHub's `&&` / `||` short-circuit on
          # truthy strings, so `inputs.X != '' && inputs.X || vars.X`
          # cleanly resolves to "input if provided, else variable."
          AUTH_MODE: ${{ inputs.AUTH_MODE != '' && inputs.AUTH_MODE || vars.AUTH_MODE }}
          QUEUE_ENABLED: ${{ inputs.QUEUE_ENABLED != '' && inputs.QUEUE_ENABLED || vars.QUEUE_ENABLED }}
          MAX_CONCURRENT: ${{ inputs.MAX_CONCURRENT != '' && inputs.MAX_CONCURRENT || vars.MAX_CONCURRENT }}
          LEADERBOARD_ENABLED: ${{ inputs.LEADERBOARD_ENABLED != '' && inputs.LEADERBOARD_ENABLED || vars.LEADERBOARD_ENABLED }}
          LEADERBOARD_DISABLED_MESSAGE: ${{ inputs.LEADERBOARD_DISABLED_MESSAGE != '' && inputs.LEADERBOARD_DISABLED_MESSAGE || vars.LEADERBOARD_DISABLED_MESSAGE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          OBS_HOST: ${{ secrets.OBS_HOST }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Fail the step on any non-zero exit from the remote script.
          script_stop: true
          # Give docker builds room on slow droplets.
          command_timeout: 15m
          # Forward repo Actions config into the remote shell so we
          # can write the droplet's .env file from them. Operational
          # toggles come from repo Variables (visible in CI logs);
          # credentials come from repo Secrets (masked).
          envs: AUTH_MODE,QUEUE_ENABLED,MAX_CONCURRENT,LEADERBOARD_ENABLED,LEADERBOARD_DISABLED_MESSAGE,TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_CHAT_ID,ADMIN_SESSION_SECRET,OBS_HOST
          script: |
            set -euo pipefail

            REPO_SLUG="${{ github.repository }}"
            REF="${{ github.ref_name }}"
            DIR="$HOME/defcon-game"

            echo "==> Target: $REPO_SLUG @ $REF"
            echo "==> Host:   $(hostname)  user: $(whoami)"
            echo "==> Path:   $DIR"
            # Surface which prod-cutover toggles are active, without
            # leaking the actual secrets to the log.
            echo "==> Env:    AUTH_MODE=${AUTH_MODE:-<unset>} QUEUE_ENABLED=${QUEUE_ENABLED:-<unset>} MAX_CONCURRENT=${MAX_CONCURRENT:-<unset>} LEADERBOARD_ENABLED=${LEADERBOARD_ENABLED:-<unset>} leaderboard_msg=$([ -n "${LEADERBOARD_DISABLED_MESSAGE:-}" ] && echo set || echo unset) admin_telegram=$([ -n "${TELEGRAM_BOT_TOKEN:-}" ] && echo set || echo unset) admin_session=$([ -n "${ADMIN_SESSION_SECRET:-}" ] && echo set || echo unset)"

            # Preflight — make sure docker is usable without sudo.
            docker version >/dev/null 2>&1 || {
              echo "docker is not available to $USER — add the user to the 'docker' group or install docker." >&2
              exit 1
            }
            docker compose version >/dev/null 2>&1 || {
              echo "docker compose v2 is required (plugin or standalone compose-v2)." >&2
              exit 1
            }

            # First deploy: clone. Subsequent: fetch + hard reset.
            if [ ! -d "$DIR/.git" ]; then
              echo "==> Cloning fresh checkout"
              git clone --depth 50 "https://github.com/${REPO_SLUG}.git" "$DIR"
            fi

            cd "$DIR"
            git remote set-url origin "https://github.com/${REPO_SLUG}.git"
            git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"
            # Resolve REF to a full SHA so the deploy is unambiguous.
            RESOLVED_SHA="$(git rev-parse "origin/${REF}" 2>/dev/null || git rev-parse "${REF}")"
            echo "==> Resolved ${REF} → ${RESOLVED_SHA}"
            git reset --hard "${RESOLVED_SHA}"

            # Write .env so docker-compose interpolation matches the local
            # workflow (cp .env.example .env). Persists across operator-run
            # `docker compose up`s without re-running this deploy. Mode 600
            # keeps secrets readable only by the deploy user.
            echo "==> Writing .env"
            umask 077
            cat > .env <<EOF
            AUTH_MODE=${AUTH_MODE:-}
            QUEUE_ENABLED=${QUEUE_ENABLED:-}
            MAX_CONCURRENT=${MAX_CONCURRENT:-}
            LEADERBOARD_ENABLED=${LEADERBOARD_ENABLED:-}
            LEADERBOARD_DISABLED_MESSAGE=${LEADERBOARD_DISABLED_MESSAGE:-}
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
            TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
            ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
            OBS_HOST=${OBS_HOST:-}
            EOF
            umask 022

            # Build + launch. --build forces a rebuild when source has changed.
            echo "==> docker compose up -d --build"
            docker compose up -d --build --remove-orphans

            echo "==> docker image prune"
            docker image prune -f >/dev/null

            echo "==> Status"
            docker compose ps

            # Smoke-check: Caddy front on :80, game-server /health on
            # loopback :8080, and the lobby reachable through the Caddy
            # proxy. /api/health (lobby) is the supported public probe —
            # the older /register page was removed when registration
            # moved into the in-game menu (PR #67).
            for i in 1 2 3 4 5; do
              if curl -fsS http://localhost:80/ >/dev/null 2>&1; then
                echo "==> client reachable on :80"
                break
              fi
              echo "    waiting for client ($i/5)…"
              sleep 2
            done
            curl -fsS http://127.0.0.1:8080/health >/dev/null \
              && echo "==> game-server /health ok" \
              || { echo "!! game-server /health failed" >&2; exit 1; }
            curl -fsS http://localhost:80/api/health >/dev/null \
              && echo "==> lobby /api/health reachable via Caddy" \
              || { echo "!! lobby /api/health unreachable via Caddy" >&2; exit 1; }

            echo "==> Deploy complete: ${REPO_SLUG}@${RESOLVED_SHA}"
