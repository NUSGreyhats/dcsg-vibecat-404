name: Deploy OBS to DigitalOcean

on:
  workflow_dispatch:

# Serialize OBS deploys so two pushes in a row don't fight for the droplet.
concurrency:
  group: deploy-obs-digitalocean
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy obs/ docker-compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OBS_DOMAIN: ${{ vars.OBS_DOMAIN }}
          OBS_BASIC_AUTH_HASH: ${{ secrets.OBS_BASIC_AUTH_HASH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OBS_HOST }}
          # Hardcoded root@ — DO_USER points to a non-root user that exists
          # only on the game droplet. Both DO droplets ship with root by
          # default; OBS uses it directly.
          username: root
          # OBS_SSH_KEY is OBS-specific. DO_SSH_KEY's public counterpart
          # is not in OBS authorized_keys (verified empirically).
          key: ${{ secrets.OBS_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          envs: OBS_DOMAIN,OBS_BASIC_AUTH_HASH,GITHUB_TOKEN
          script: |
            set -euo pipefail

            REPO_SLUG="${{ github.repository }}"
            REF="${{ github.ref_name }}"
            DIR="$HOME/defcon-game"
            REPO_URL_AUTH="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_SLUG}.git"
            REPO_URL_PLAIN="https://github.com/${REPO_SLUG}.git"

            echo "==> Target: $REPO_SLUG @ $REF"
            echo "==> Host:   $(hostname)  user: $(whoami)"
            echo "==> Path:   $DIR"
            echo "==> Env:    OBS_DOMAIN=${OBS_DOMAIN:-<unset>} basic_auth=$([ -n "${OBS_BASIC_AUTH_HASH:-}" ] && echo set || echo unset)"

            docker version >/dev/null 2>&1 || { echo "docker is not available" >&2; exit 1; }
            docker compose version >/dev/null 2>&1 || { echo "docker compose v2 is required" >&2; exit 1; }

            if [ ! -d "$DIR/.git" ]; then
              echo "==> Cloning fresh checkout"
              git clone --depth 50 "$REPO_URL_AUTH" "$DIR"
            fi

            cd "$DIR"
            # Use the token for this fetch; restore the plain URL after
            # so the token doesn't sit in .git/config between runs (the
            # token expires when the workflow does anyway).
            git remote set-url origin "$REPO_URL_AUTH"
            git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"
            git remote set-url origin "$REPO_URL_PLAIN"

            RESOLVED_SHA="$(git rev-parse "origin/${REF}" 2>/dev/null || git rev-parse "${REF}")"
            echo "==> Resolved ${REF} → ${RESOLVED_SHA}"
            git reset --hard "${RESOLVED_SHA}"

            echo "==> swap setup"
            bash obs/setup-swap.sh

            # Write obs/.env from forwarded vars. The bcrypt hash is single-
            # quoted so docker-compose's env_file parser doesn't apply
            # parameter expansion to the $-containing value.
            echo "==> Writing obs/.env"
            umask 077
            cat > obs/.env <<EOF
            OBS_DOMAIN=${OBS_DOMAIN:-}
            OBS_BASIC_AUTH_HASH='${OBS_BASIC_AUTH_HASH:-}'
            EOF
            umask 022

            echo "==> docker compose up -d --build"
            docker compose -f obs/docker-compose.yml up -d --build --remove-orphans

            echo "==> docker image prune"
            docker image prune -f >/dev/null

            echo "==> Status"
            docker compose -f obs/docker-compose.yml ps

            echo "==> Caddy on :80"
            curl -sS -o /dev/null -w "  http://localhost/ → %{http_code}\n" http://localhost/ || true

            echo "==> VictoriaMetrics health (via Grafana container — VM image has no wget)"
            docker compose -f obs/docker-compose.yml exec -T grafana \
              wget -qO- 'http://victoria-metrics:8428/health' \
              && echo "  VM OK" \
              || { echo "!! VictoriaMetrics health failed" >&2; exit 1; }

            echo "==> Deploy complete: ${REPO_SLUG}@${RESOLVED_SHA}"
