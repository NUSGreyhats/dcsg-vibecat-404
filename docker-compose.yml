services:
  game-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      # identity mode: WS C2S_AUTH requires the player_id to exist in
      # identity.db. Players must register (username + password) before
      # they can play.
      # Set AUTH_MODE=token + MAX_CONCURRENT=4 + lobby's QUEUE_ENABLED=true
      # for the prod cutover. Default dev posture is identity-mode with
      # a generous concurrency cap, so anyone who's registered can play
      # without waiting in line.
      AUTH_MODE: "${AUTH_MODE:-identity}"
      MAX_CONCURRENT: "${MAX_CONCURRENT:-64}"
      GAME_DB: "/data/game.db"
      IDENTITY_DB: "/data/identity.db"
      ALLOWLIST_PATH: "/data/allowlist.json"
      # Shared with the lobby. Game server uses it to validate replay
      # tickets minted by lobby's POST /admin/replay/:id/ticket. Empty
      # disables /ws/replay (returns 503 — same posture as lobby's
      # /admin/* with admin auth unconfigured).
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
      # Set to false to ship without the leaderboard. Game server skips
      # the submit goroutine and /ws/replay; lobby 503s its leaderboard
      # surfaces. See .env.example for full effect.
      LEADERBOARD_ENABLED: "${LEADERBOARD_ENABLED:-true}"
    volumes:
      - game-data:/data
    # Bind to loopback only: all browser traffic goes through the Caddy
    # client container on :3000, which reverse-proxies /ws, /api/*, and
    # /register to the appropriate service. Binding to 127.0.0.1 keeps the
    # dev-only leaderboard JSON endpoint off the public internet.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  lobby:
    build:
      context: .
      dockerfile: lobby/Dockerfile
    environment:
      LISTEN_ADDR: ":3001"
      IDENTITY_DB: "/data/identity.db"
      # Read-only access to the game server's leaderboard DB. WAL mode
      # (set in server/internal/leaderboard/db.go) lets both processes
      # share the file safely.
      GAME_DB: "/data/game.db"
      # Admin auth: Telegram OTP. /admin/login posts a 6-digit code
      # to the configured chat; admins enter it on /admin/verify to
      # exchange for a 24 h HMAC-signed session cookie. Empty values
      # disable the panel (every /admin/* request returns 503).
      # ADMIN_SESSION_SECRET is used to sign session cookies — must be
      # ≥ 16 bytes and rotated to invalidate every issued session.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ADMIN_CHAT_ID: "${TELEGRAM_ADMIN_CHAT_ID:-}"
      ADMIN_SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
      # FIFO queue + slot handoff (Phase 5 #25). Off by default so dev
      # deploys don't write allowlist.json. Set QUEUE_ENABLED=true
      # together with the game-server's AUTH_MODE=token + MAX_CONCURRENT=4
      # for the prod cutover.
      QUEUE_ENABLED: "${QUEUE_ENABLED:-false}"
      LOBBY_DB: "/data/lobby.db"
      ALLOWLIST_PATH: "/data/allowlist.json"
      # Mirror of the game-server flag. When false the lobby 503s its
      # public + admin leaderboard/replay endpoints and /api/config
      # advertises the disabled state to the client.
      LEADERBOARD_ENABLED: "${LEADERBOARD_ENABLED:-true}"
      # Surfaced via /api/config; rendered by the win screen when
      # leaderboard is disabled. Empty → server default.
      LEADERBOARD_DISABLED_MESSAGE: "${LEADERBOARD_DISABLED_MESSAGE:-}"
      # Stripped source baked into the lobby image as a single tarball
      # by the strip stage in lobby/Dockerfile. /source serves an HTML
      # download page; /source.tar.gz streams the file. Override only
      # for ad-hoc testing.
      SOURCE_TARBALL: "/app/source.tar.gz"
    volumes:
      - game-data:/data
    # Loopback only — public traffic enters via the Caddy client container.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:3000"
    depends_on:
      - game-server
      - lobby
    restart: unless-stopped

volumes:
  game-data:
