services:
  game-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      # identity mode: WS C2S_AUTH requires the player_id to exist in
      # identity.db. Players must register (username + password) before
      # they can play.
      # Set AUTH_MODE=token + MAX_CONCURRENT=4 + lobby's QUEUE_ENABLED=true
      # for the prod cutover. Default dev posture is identity-mode with
      # a generous concurrency cap, so anyone who's registered can play
      # without waiting in line.
      AUTH_MODE: "${AUTH_MODE:-identity}"
      MAX_CONCURRENT: "${MAX_CONCURRENT:-64}"
      GAME_DB: "/data/game.db"
      IDENTITY_DB: "/data/identity.db"
      ALLOWLIST_PATH: "/data/allowlist.json"
    volumes:
      - game-data:/data
    # Bind to loopback only: all browser traffic goes through the Caddy
    # client container on :3000, which reverse-proxies /ws, /api/*, and
    # /register to the appropriate service. Binding to 127.0.0.1 keeps the
    # dev-only leaderboard JSON endpoint off the public internet.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  lobby:
    build:
      context: .
      dockerfile: lobby/Dockerfile
    environment:
      LISTEN_ADDR: ":3001"
      IDENTITY_DB: "/data/identity.db"
      # Read-only access to the game server's leaderboard DB. WAL mode
      # (set in server/internal/leaderboard/db.go) lets both processes
      # share the file safely.
      GAME_DB: "/data/game.db"
      # Admin panel credentials (Phase 4 #24). Empty values disable
      # the panel — set both in the deployment's secret store. The
      # hash is bcrypt; generate one with `htpasswd -bnBC 10 USER PASSWORD`.
      ADMIN_USER: "${ADMIN_USER:-}"
      ADMIN_PASS_HASH: "${ADMIN_PASS_HASH:-}"
      # FIFO queue + slot handoff (Phase 5 #25). Off by default so dev
      # deploys don't write allowlist.json. Set QUEUE_ENABLED=true
      # together with the game-server's AUTH_MODE=token + MAX_CONCURRENT=4
      # for the prod cutover.
      QUEUE_ENABLED: "${QUEUE_ENABLED:-false}"
      LOBBY_DB: "/data/lobby.db"
      ALLOWLIST_PATH: "/data/allowlist.json"
      # Stripped source baked into the lobby image as a single tarball
      # by the strip stage in lobby/Dockerfile. /source serves an HTML
      # download page; /source.tar.gz streams the file. Override only
      # for ad-hoc testing.
      SOURCE_TARBALL: "/app/source.tar.gz"
    volumes:
      - game-data:/data
    # Loopback only — public traffic enters via the Caddy client container.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:3000"
    depends_on:
      - game-server
      - lobby
    restart: unless-stopped

volumes:
  game-data:
