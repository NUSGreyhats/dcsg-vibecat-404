services:
  game-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      AUTH_MODE: "identity"
      MAX_CONCURRENT: "64"
      GAME_DB: "/data/game.db"
      IDENTITY_DB: "/data/identity.db"
      ALLOWLIST_PATH: "/data/allowlist.json"
    volumes:
      - game-data:/data
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  lobby:
    build:
      context: .
      dockerfile: lobby/Dockerfile
    environment:
      LISTEN_ADDR: ":3001"
      IDENTITY_DB: "/data/identity.db"
      GAME_DB: "/data/game.db"
    volumes:
      - game-data:/data
    ports:
      - "127.0.0.1:3081:3001"
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8001:3000"
    depends_on:
      - game-server
      - lobby
    restart: unless-stopped

volumes:
  game-data:
