# OBS observability stack. See ../docs/specs/observability/design.md.
# Run from obs/: `docker compose up -d --build`.

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    container_name: obs-victoria-metrics
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=7d"
      - "-promscrape.config=/etc/victoria-metrics/scrape.yml"
      - "-search.maxSeries=10000"
      - "-memory.allowedPercent=70"
      - "-httpListenAddr=:8428"
    volumes:
      - vm-data:/storage
      - ./victoria-metrics/scrape.yml:/etc/victoria-metrics/scrape.yml:ro
    # game-droplet-dev hostname → dev droplet IP, used in scrape.yml.
    # Prod is scraped via its public domain (vibecat.nusgreyhats.org)
    # over HTTPS, so no alias is needed there. Unset GAME_HOST_DEV
    # defaults to 127.0.0.1 → up{env="dev"} = 0 (visibly failing,
    # rather than silently scraping the wrong host).
    extra_hosts:
      - "game-droplet-dev:${GAME_HOST_DEV:-127.0.0.1}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: obs-grafana
    # Anonymous Editor; admin login disabled. See design.md "Grafana auth".
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_INSTALL_PLUGINS: ""
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - victoria-metrics
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: obs-caddy
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - grafana
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: obs-node-exporter
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

volumes:
  vm-data:
  grafana-data:
  caddy-data:
  caddy-config:
